<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Page introuvable — Jloodna</title>
  <link rel="icon" href="../frontend/assets/images/favicon.svg">
  <link rel="stylesheet" href="../frontend/assets/css/variables.css">
  <link rel="stylesheet" href="../frontend/assets/css/main.css">
  <style>
    body{background:linear-gradient(135deg,#0a2342 0%,#1565c0 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
    .error-card{background:#fff;border-radius:24px;padding:48px 40px;text-align:center;max-width:520px;width:100%;box-shadow:0 24px 80px rgba(0,0,0,.3)}
    .error-num{font-size:120px;font-weight:900;color:#e2e8f0;line-height:1;margin-bottom:0;font-family:var(--font-display)}
    .error-emoji{font-size:64px;margin:-20px 0 16px;display:block}
    .search-404{display:flex;gap:0;border:2px solid #e2e8f0;border-radius:10px;overflow:hidden;margin:24px 0}
    .search-404 input{flex:1;padding:12px 16px;border:none;font-size:14px}
    .search-404 button{padding:0 20px;background:#0a2342;color:#fff;border:none;font-size:18px;cursor:pointer}
    .quick-links{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:20px}
  </style>
</head>
<body>
<div class="error-card">
  <div class="error-num">404</div>
  <span class="error-emoji">🔍</span>
  <h1 style="font-family:var(--font-display);font-size:26px;font-weight:700;color:#0a2342;margin-bottom:8px">Page introuvable</h1>
  <p style="color:#9aa3b2;font-size:14px;margin-bottom:0">La page que vous cherchez n'existe pas ou a été déplacée. Essayez de rechercher ce que vous voulez:</p>
  <div class="search-404">
    <input type="text" id="search404" placeholder="Chercher un produit…" onkeydown="if(event.key==='Enter')search404()">
    <button onclick="search404()">🔍</button>
  </div>
  <div class="quick-links">
    <a href="../index.html" class="chip active">🏠 Accueil</a>
    <a href="shop.html" class="chip">🛍️ Boutique</a>
    <a href="search.html" class="chip">🔍 Recherche</a>
    <a href="contact.html" class="chip">💬 Contact</a>
    <a href="faq.html" class="chip">❓ FAQ</a>
  </div>
  <div style="margin-top:24px;padding-top:20px;border-top:1px solid #e2e8f0">
    <p style="font-size:12px;color:#9aa3b2">Vous pouvez également revenir à la page précédente:</p>
    <button onclick="history.back()" class="btn btn-outline" style="margin-top:8px">← Retour</button>
  </div>
</div>
<script>
  function search404() {
    const q = document.getElementById('search404').value.trim();
    if (q) window.location.href = '../pages/search.html?q=' + encodeURIComponent(q);
  }
</script>
</body>
</html>
