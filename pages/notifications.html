<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Notifications — Jloodna</title>
  <link rel="icon" href="../frontend/assets/images/favicon.svg">
  <link rel="stylesheet" href="../frontend/assets/css/variables.css">
  <link rel="stylesheet" href="../frontend/assets/css/main.css">
  <style>
    .notif-card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:16px 20px;margin-bottom:10px;display:flex;gap:14px;align-items:flex-start;transition:all .15s;cursor:pointer}
    .notif-card:hover{box-shadow:0 4px 16px rgba(0,0,0,.06);transform:translateX(4px)}
    .notif-card.unread{border-left:4px solid #1565c0;background:#f8faff}
    .notif-type-icon{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
    .notif-filter{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
    .notif-filter button{padding:8px 16px;border-radius:30px;border:2px solid #e2e8f0;background:#fff;font-size:13px;font-weight:600;color:#4a5568;cursor:pointer;transition:all .15s}
    .notif-filter button.active,.notif-filter button:hover{background:#0a2342;color:#fff;border-color:#0a2342}
  </style>
</head>
<body>
<div id="appHeader"></div>
<main class="container section">
  <div class="breadcrumb">
    <a href="../index.html">Accueil</a><span class="breadcrumb-sep">›</span>
    <span class="breadcrumb-current">Notifications</span>
  </div>
  <div class="section-header">
    <div>
      <h1 class="section-title">🔔 <span>Notifications</span></h1>
      <p class="section-subtitle" id="notifMeta">Chargement…</p>
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn btn-outline btn-sm" onclick="markAllRead()">✓ Tout lire</button>
      <button class="btn btn-sm" style="background:#fff3f3;color:#c62828;border:1px solid #fca5a5" onclick="clearAll()">🗑️ Tout effacer</button>
    </div>
  </div>

  <div class="notif-filter" id="notifFilter">
    <button class="active" onclick="filterNotifs('all',this)">🌐 Toutes</button>
    <button onclick="filterNotifs('order',this)">📦 Commandes</button>
    <button onclick="filterNotifs('promo',this)">🔥 Promos</button>
    <button onclick="filterNotifs('account',this)">👤 Compte</button>
    <button onclick="filterNotifs('system',this)">⚙️ Système</button>
  </div>

  <div id="notifList"></div>

  <!-- Notification preferences -->
  <div style="background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:24px;margin-top:32px">
    <h3 style="font-weight:700;color:#0a2342;margin-bottom:16px">⚙️ Préférences de notifications</h3>
    <div style="display:flex;flex-direction:column;gap:14px">
      <label style="display:flex;justify-content:space-between;align-items:center;cursor:pointer">
        <span style="font-size:14px;color:#1a1a2e">📦 Mises à jour de commandes</span>
        <input type="checkbox" checked style="width:18px;height:18px;accent-color:#0a2342">
      </label>
      <label style="display:flex;justify-content:space-between;align-items:center;cursor:pointer">
        <span style="font-size:14px;color:#1a1a2e">🔥 Offres et promotions</span>
        <input type="checkbox" checked style="width:18px;height:18px;accent-color:#0a2342">
      </label>
      <label style="display:flex;justify-content:space-between;align-items:center;cursor:pointer">
        <span style="font-size:14px;color:#1a1a2e">🆕 Nouveaux produits</span>
        <input type="checkbox" style="width:18px;height:18px;accent-color:#0a2342">
      </label>
      <label style="display:flex;justify-content:space-between;align-items:center;cursor:pointer">
        <span style="font-size:14px;color:#1a1a2e">💰 Alertes prix (favoris)</span>
        <input type="checkbox" checked style="width:18px;height:18px;accent-color:#0a2342">
      </label>
      <label style="display:flex;justify-content:space-between;align-items:center;cursor:pointer">
        <span style="font-size:14px;color:#1a1a2e">📧 Notifications par email</span>
        <input type="checkbox" checked style="width:18px;height:18px;accent-color:#0a2342">
      </label>
    </div>
    <button class="btn btn-primary" style="margin-top:16px" onclick="Toast.show('success','✅ Sauvegardé','Préférences mises à jour')">Sauvegarder</button>
  </div>
</main>
<div id="appFooter"></div>
<script src="../frontend/assets/js/app.js"></script>
<script src="../frontend/assets/js/layout.js"></script>
<script>
  const TYPE_CONFIG = {
    order:   { icon:'📦', bg:'#e8f5e9', label:'Commande' },
    promo:   { icon:'🔥', bg:'#fff8e1', label:'Promo' },
    account: { icon:'👤', bg:'#e3f2fd', label:'Compte' },
    system:  { icon:'⚙️', bg:'#f3e5f5', label:'Système' },
    default: { icon:'🔔', bg:'#f5f5f0', label:'Info' },
  };

  // Seed demo notifications if none
  function seedNotifs() {
    if (Notifs.list.length < 3) {
      const demos = [
        { title:'✅ Commande confirmée', message:'Votre commande JL-DEMO-001 a été confirmée!', type:'order' },
        { title:'🔥 Offre Flash 30%', message:'Réduction de 30% sur toute l\'électronique aujourd\'hui seulement!', type:'promo' },
        { title:'📦 Colis expédié', message:'Votre commande est en route! Suivi disponible.', type:'order' },
        { title:'💰 Prix en baisse', message:'L\'iPhone 15 Pro que vous avez sauvegardé a baissé de G 5 000!', type:'promo' },
        { title:'👤 Connexion détectée', message:'Nouvelle connexion depuis un appareil mobile.', type:'account' },
        { title:'🆕 Nouveaux produits', message:'15 nouveaux produits ajoutés dans la catégorie Électronique.', type:'system' },
      ];
      demos.forEach((d, i) => {
        Notifs.list.push({ ...d, id: Date.now() + i, read: i > 1, time: new Date(Date.now() - i * 3600000 * 8).toISOString() });
      });
      localStorage.setItem('jl_notifs', JSON.stringify(Notifs.list));
    }
  }

  let currentFilter = 'all';

  function renderNotifs() {
    let list = Notifs.list;
    if (currentFilter !== 'all') list = list.filter(n => n.type === currentFilter);
    const unread = list.filter(n => !n.read).length;
    document.getElementById('notifMeta').textContent = `${list.length} notification(s) · ${unread} non lue(s)`;
    const el = document.getElementById('notifList');
    if (!list.length) {
      el.innerHTML = `<div class="empty-state"><div class="empty-state-icon">🔔</div><div class="empty-state-title">Aucune notification</div><div class="empty-state-msg">Vous n'avez pas de notifications dans cette catégorie.</div></div>`;
      return;
    }
    el.innerHTML = list.map(n => {
      const t = TYPE_CONFIG[n.type] || TYPE_CONFIG.default;
      return `<div class="notif-card ${n.read?'':'unread'}" onclick="markRead('${n.id}')">
        <div class="notif-type-icon" style="background:${t.bg}">${t.icon}</div>
        <div style="flex:1">
          <div style="font-weight:700;font-size:14px;color:#0a2342;margin-bottom:3px">${n.title}</div>
          <div style="font-size:13px;color:#4a5568">${n.message}</div>
          <div style="font-size:11px;color:#9aa3b2;margin-top:5px;display:flex;gap:8px;align-items:center">
            <span>${timeAgo(n.time)}</span>
            <span class="badge" style="background:${t.bg};color:#4a5568;font-size:9px">${t.label}</span>
          </div>
        </div>
        ${!n.read ? '<div style="width:10px;height:10px;border-radius:50%;background:#1565c0;flex-shrink:0;margin-top:4px"></div>' : ''}
      </div>`;
    }).join('');
  }

  function markRead(id) {
    const n = Notifs.list.find(x => x.id == id);
    if (n && !n.read) { n.read = true; localStorage.setItem('jl_notifs', JSON.stringify(Notifs.list)); Notifs.updateBadge(); renderNotifs(); }
  }

  function markAllRead() {
    Notifs.list.forEach(n => n.read = true);
    localStorage.setItem('jl_notifs', JSON.stringify(Notifs.list));
    Notifs.updateBadge(); renderNotifs();
    Toast.show('success','✓ Tout marqué comme lu');
  }

  function clearAll() {
    if (!confirm('Effacer toutes les notifications?')) return;
    Notifs.list = []; localStorage.setItem('jl_notifs', '[]');
    Notifs.updateBadge(); renderNotifs();
    Toast.show('info','Notifications effacées');
  }

  function filterNotifs(type, btn) {
    currentFilter = type;
    document.querySelectorAll('.notif-filter button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderNotifs();
  }

  document.addEventListener('DOMContentLoaded', () => { seedNotifs(); renderNotifs(); });
</script>
</body>
</html>
