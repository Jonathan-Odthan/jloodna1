<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recherche — Jloodna</title>
  <link rel="icon" href="../frontend/assets/images/favicon.svg">
  <link rel="stylesheet" href="../frontend/assets/css/variables.css">
  <link rel="stylesheet" href="../frontend/assets/css/main.css">
  <style>
    .search-header{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:24px;margin-bottom:24px}
    .filter-chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
    .search-layout{display:grid;gap:24px;grid-template-columns:1fr}
    @media(min-width:900px){.search-layout{grid-template-columns:240px 1fr}}
    .filter-sidebar{background:#fff;border-radius:12px;border:1px solid #e2e8f0;padding:20px;height:fit-content;position:sticky;top:80px}
    .filter-section{margin-bottom:20px;padding-bottom:20px;border-bottom:1px solid #e2e8f0}
    .filter-section:last-child{border:none;margin:0;padding:0}
    .filter-title{font-weight:700;font-size:13px;color:#0a2342;margin-bottom:10px;text-transform:uppercase;letter-spacing:.5px}
    .filter-list{display:flex;flex-direction:column;gap:7px}
    .filter-check{display:flex;align-items:center;gap:8px;font-size:13px;color:#4a5568;cursor:pointer}
    .filter-check input{accent-color:#0a2342;width:15px;height:15px}
    .sort-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#fff;padding:12px 16px;border-radius:10px;border:1px solid #e2e8f0;margin-bottom:16px}
    .sort-bar select{padding:7px 12px;border:1px solid #e2e8f0;border-radius:8px;font-size:13px;color:#0a2342;background:#fff;cursor:pointer}
    .suggestions{background:#fff;border-radius:12px;border:1px solid #e2e8f0;padding:20px;margin-bottom:20px}
    .suggestion-tag{display:inline-block;background:#f0f4ff;color:#1565c0;padding:6px 14px;border-radius:20px;font-size:13px;margin:4px;cursor:pointer;transition:all .15s;border:1px solid #e2e8f0}
    .suggestion-tag:hover{background:#1565c0;color:#fff}
    .pagination{display:flex;gap:6px;justify-content:center;margin-top:28px}
    .page-btn{width:38px;height:38px;border-radius:8px;border:1px solid #e2e8f0;background:#fff;font-size:13px;font-weight:600;cursor:pointer;color:#0a2342;transition:all .15s}
    .page-btn.active,.page-btn:hover{background:#0a2342;color:#fff;border-color:#0a2342}
  </style>
</head>
<body>
<div id="appHeader"></div>
<main class="container section">
  <div class="breadcrumb">
    <a href="../index.html">Accueil</a><span class="breadcrumb-sep">›</span>
    <span class="breadcrumb-current">Recherche</span>
  </div>

  <!-- Search Header -->
  <div class="search-header">
    <form id="advSearch" style="display:flex;gap:10px;flex-wrap:wrap">
      <input type="text" id="mainSearch" class="form-control" placeholder="Rechercher des produits, marques, catégories…" style="flex:1;min-width:200px" autocomplete="off">
      <select id="catSearch" class="form-control" style="width:auto;min-width:140px">
        <option value="">Toutes les catégories</option>
      </select>
      <button type="submit" class="btn btn-primary">🔍 Rechercher</button>
    </form>
    <div id="searchMeta" style="font-size:13px;color:#9aa3b2;margin-top:10px"></div>
    <div class="filter-chips" id="activeChips"></div>
  </div>

  <!-- Suggestions -->
  <div class="suggestions" id="suggestionsEl">
    <div style="font-size:13px;font-weight:700;color:#0a2342;margin-bottom:8px">🔥 Recherches populaires</div>
    <div>
      <span class="suggestion-tag" onclick="quickSearch('iPhone')">iPhone</span>
      <span class="suggestion-tag" onclick="quickSearch('Nike')">Nike</span>
      <span class="suggestion-tag" onclick="quickSearch('Samsung')">Samsung</span>
      <span class="suggestion-tag" onclick="quickSearch('Robe')">Robe</span>
      <span class="suggestion-tag" onclick="quickSearch('MacBook')">MacBook</span>
      <span class="suggestion-tag" onclick="quickSearch('PlayStation')">PlayStation</span>
      <span class="suggestion-tag" onclick="quickSearch('Vélo')">Vélo</span>
      <span class="suggestion-tag" onclick="quickSearch('Cosmétiques')">Cosmétiques</span>
    </div>
  </div>

  <div class="search-layout">
    <!-- Filters -->
    <aside class="filter-sidebar">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
        <span style="font-weight:700;color:#0a2342;font-size:14px">🔽 Affiner</span>
        <button onclick="clearAllFilters()" style="font-size:12px;color:#1565c0;background:none;border:none;cursor:pointer">Effacer</button>
      </div>
      <div class="filter-section">
        <div class="filter-title">Prix (HTG)</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
          <input type="number" id="minPrice" class="form-control" placeholder="Min" style="font-size:13px;padding:7px 10px">
          <input type="number" id="maxPrice" class="form-control" placeholder="Max" style="font-size:13px;padding:7px 10px">
        </div>
      </div>
      <div class="filter-section">
        <div class="filter-title">Catégorie</div>
        <div class="filter-list" id="catFilterList"></div>
      </div>
      <div class="filter-section">
        <div class="filter-title">Marque</div>
        <div class="filter-list" id="brandFilterList"></div>
      </div>
      <div class="filter-section">
        <div class="filter-title">Note</div>
        <div class="filter-list">
          <label class="filter-check"><input type="radio" name="ratingF" value="4"> ★★★★☆ et plus</label>
          <label class="filter-check"><input type="radio" name="ratingF" value="3"> ★★★☆☆ et plus</label>
          <label class="filter-check"><input type="radio" name="ratingF" value="0" checked> Toutes les notes</label>
        </div>
      </div>
      <div class="filter-section">
        <div class="filter-title">Disponibilité</div>
        <div class="filter-list">
          <label class="filter-check"><input type="checkbox" id="fInStock"> En stock uniquement</label>
          <label class="filter-check"><input type="checkbox" id="fDropship"> Dropshipping</label>
          <label class="filter-check"><input type="checkbox" id="fPromo"> En promotion</label>
        </div>
      </div>
      <button onclick="doSearch()" class="btn btn-primary btn-block">Appliquer</button>
    </aside>

    <!-- Results -->
    <div>
      <div class="sort-bar">
        <span id="resultCount" style="font-size:13px;color:#4a5568;font-weight:500"></span>
        <select id="sortF" onchange="doSearch()" style="margin-left:auto">
          <option value="">Pertinence</option>
          <option value="price_asc">Prix ↑</option>
          <option value="price_desc">Prix ↓</option>
          <option value="rating">Meilleures notes</option>
          <option value="reviews">Popularité</option>
        </select>
      </div>
      <div class="product-grid" id="searchResults"></div>
      <div class="pagination" id="pagination"></div>
    </div>
  </div>
</main>
<div id="appFooter"></div>
<script src="../frontend/assets/js/app.js"></script>
<script src="../frontend/assets/js/products.js"></script>
<script src="../frontend/assets/js/layout.js"></script>
<script>
  let searchResults = [], page = 1;
  const PER_PAGE = 12;

  function initSidebar() {
    const catEl = document.getElementById('catFilterList');
    const brandEl = document.getElementById('brandFilterList');
    const catSel = document.getElementById('catSearch');
    CATEGORIES.forEach(c => {
      catSel.innerHTML += `<option value="${c.slug}">${c.icon} ${c.name}</option>`;
      catEl.innerHTML += `<label class="filter-check"><input type="checkbox" class="fc" value="${c.slug}"> ${c.icon} ${c.name}</label>`;
    });
    [...new Set(Products.all().map(p => p.brand))].forEach(b => {
      brandEl.innerHTML += `<label class="filter-check"><input type="checkbox" class="fb" value="${b}"> ${b}</label>`;
    });
  }

  function doSearch() {
    const q = document.getElementById('mainSearch').value.trim();
    const cat = document.getElementById('catSearch').value;
    const minP = parseInt(document.getElementById('minPrice').value) || 0;
    const maxP = parseInt(document.getElementById('maxPrice').value) || 999999;
    const rating = parseFloat(document.querySelector('input[name=ratingF]:checked')?.value || 0);
    const inStock = document.getElementById('fInStock').checked;
    const dropship = document.getElementById('fDropship').checked;
    const promo = document.getElementById('fPromo').checked;
    const sort = document.getElementById('sortF').value;
    const checkedCats = [...document.querySelectorAll('.fc:checked')].map(c => c.value);
    const checkedBrands = [...document.querySelectorAll('.fb:checked')].map(b => b.value);

    let res = Products.search(q, { minPrice: minP, maxPrice: maxP, rating, inStock, sort });
    if (cat) res = res.filter(p => p.category === cat);
    else if (checkedCats.length) res = res.filter(p => checkedCats.includes(p.category));
    if (checkedBrands.length) res = res.filter(p => checkedBrands.includes(p.brand));
    if (dropship) res = res.filter(p => p.dropship);
    if (promo) res = res.filter(p => p.priceOld && p.priceOld > p.price);

    searchResults = res;
    page = 1;

    const meta = document.getElementById('searchMeta');
    meta.innerHTML = q ? `Résultats pour <strong>"${sanitize(q)}"</strong> — ${res.length} produit(s) trouvé(s)` : `${res.length} produit(s)`;

    document.getElementById('suggestionsEl').style.display = res.length > 0 ? 'none' : 'block';
    renderPage();
    updateChips(q, cat, checkedCats);
    history.replaceState(null, '', `?q=${encodeURIComponent(q)}&cat=${encodeURIComponent(cat)}`);
  }

  function renderPage() {
    const start = (page - 1) * PER_PAGE;
    const slice = searchResults.slice(start, start + PER_PAGE);
    document.getElementById('resultCount').textContent = `${searchResults.length} résultat(s)`;
    Products.renderGrid(slice, 'searchResults');
    renderPagination();
  }

  function renderPagination() {
    const pages = Math.ceil(searchResults.length / PER_PAGE);
    const el = document.getElementById('pagination');
    if (pages <= 1) { el.innerHTML = ''; return; }
    el.innerHTML = Array.from({ length: pages }, (_, i) =>
      `<button class="page-btn ${i + 1 === page ? 'active' : ''}" onclick="goPage(${i + 1})">${i + 1}</button>`).join('');
  }

  function goPage(p) { page = p; renderPage(); window.scrollTo({ top: 0, behavior: 'smooth' }); }

  function updateChips(q, cat, cats) {
    const el = document.getElementById('activeChips');
    const chips = [];
    if (q) chips.push(`<span class="chip active">"${sanitize(q)}" <span class="chip-remove" onclick="clearQ()">✕</span></span>`);
    if (cat) { const c = CATEGORIES.find(x => x.slug === cat); if (c) chips.push(`<span class="chip active">${c.icon} ${c.name}</span>`); }
    el.innerHTML = chips.join('');
  }

  function clearQ() { document.getElementById('mainSearch').value = ''; doSearch(); }
  function clearAllFilters() {
    document.getElementById('mainSearch').value = '';
    document.getElementById('catSearch').value = '';
    document.getElementById('minPrice').value = '';
    document.getElementById('maxPrice').value = '';
    document.querySelectorAll('.fc, .fb, #fInStock, #fDropship, #fPromo').forEach(el => el.checked = false);
    document.querySelector('input[name=ratingF][value="0"]').checked = true;
    doSearch();
  }

  function quickSearch(q) {
    document.getElementById('mainSearch').value = q;
    doSearch();
    document.getElementById('mainSearch').focus();
  }

  document.getElementById('advSearch').addEventListener('submit', e => { e.preventDefault(); doSearch(); });

  document.addEventListener('DOMContentLoaded', () => {
    initSidebar();
    const q = getParam('q') || '';
    const cat = getParam('cat') || '';
    document.getElementById('mainSearch').value = q;
    document.getElementById('catSearch').value = cat;
    doSearch();
  });
</script>
</body>
</html>
