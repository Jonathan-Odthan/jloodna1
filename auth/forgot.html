<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mot de passe oublié — Jloodna</title>
  <link rel="icon" href="../frontend/assets/images/favicon.svg">
  <link rel="stylesheet" href="../frontend/assets/css/variables.css">
  <link rel="stylesheet" href="../frontend/assets/css/main.css">
  <style>
    body{background:linear-gradient(135deg,#0a2342 0%,#1565c0 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
    .auth-card{background:#fff;border-radius:20px;box-shadow:0 24px 80px rgba(0,0,0,.3);width:100%;max-width:440px;padding:40px}
  </style>
</head>
<body>
<div class="auth-card">
  <div style="text-align:center;margin-bottom:24px">
    <div style="font-size:48px;margin-bottom:8px">🔑</div>
    <div style="font-family:var(--font-display);font-size:26px;font-weight:700;color:#0a2342">Jloodna</div>
    <div style="font-size:11px;color:#ff6f00;letter-spacing:2px;text-transform:uppercase">Global Trading</div>
  </div>
  <h1 style="font-family:var(--font-display);font-size:22px;font-weight:700;color:#0a2342;text-align:center;margin-bottom:6px">Mot de passe oublié?</h1>
  <p style="text-align:center;font-size:13px;color:#9aa3b2;margin-bottom:28px">Entrez votre email et nous vous enverrons un lien de réinitialisation.</p>

  <div id="formSection">
    <div class="form-group">
      <label class="form-label" for="resetEmail">Adresse Email</label>
      <input type="email" id="resetEmail" class="form-control" placeholder="vous@exemple.com" autocomplete="email" required>
      <div class="form-error" id="emailErr"></div>
    </div>
    <button class="btn btn-primary btn-block btn-lg" id="resetBtn" onclick="sendReset()">Envoyer le lien</button>
  </div>

  <div id="successSection" style="display:none;text-align:center">
    <div style="font-size:56px;margin-bottom:16px">📧</div>
    <h3 style="font-weight:700;color:#0a2342;margin-bottom:8px">Email envoyé!</h3>
    <p style="font-size:14px;color:#4a5568;margin-bottom:20px">Vérifiez votre boîte mail. Le lien expire dans <strong>30 minutes</strong>.</p>
    <p style="font-size:12px;color:#9aa3b2">Pas reçu? <button onclick="resend()" style="background:none;border:none;color:#1565c0;font-weight:600;cursor:pointer;font-size:12px">Renvoyer</button></p>
  </div>

  <div style="text-align:center;margin-top:24px;display:flex;flex-direction:column;gap:8px">
    <a href="login.html" style="font-size:13px;color:#1565c0;font-weight:600">← Retour à la connexion</a>
    <a href="../index.html" style="font-size:13px;color:#9aa3b2">Retour à la boutique</a>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>
<script src="../frontend/assets/js/app.js"></script>
<script>
  let resendCount = 0;
  async function sendReset() {
    const email = document.getElementById('resetEmail').value.trim();
    document.getElementById('emailErr').textContent = '';
    if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      document.getElementById('emailErr').textContent = 'Email invalide.'; return;
    }
    const btn = document.getElementById('resetBtn');
    btn.innerHTML = '<span class="loader"></span> Envoi…'; btn.disabled = true;
    await new Promise(r => setTimeout(r, 1200));
    document.getElementById('formSection').style.display = 'none';
    document.getElementById('successSection').style.display = 'block';
  }
  function resend() {
    if (resendCount >= 3) { Toast.show('warning','Limite atteinte','Trop de tentatives. Attendez 10 minutes.'); return; }
    resendCount++;
    Toast.show('success','📧 Email renvoyé','Vérifiez votre boîte mail.');
  }
  document.addEventListener('DOMContentLoaded', () => Toast.init());
</script>
</body>
</html>
