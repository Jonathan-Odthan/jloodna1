<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Maintenance — Jloodna</title>
  <link rel="icon" href="frontend/assets/images/favicon.svg" type="image/svg+xml">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'DM Sans','Helvetica Neue',Arial,sans-serif;background:linear-gradient(135deg,#0a2342 0%,#1565c0 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;color:#fff}
    .card{background:rgba(255,255,255,.07);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.15);border-radius:24px;padding:48px 40px;text-align:center;max-width:560px;width:100%}
    .logo{font-family:Georgia,serif;font-size:32px;font-weight:700;margin-bottom:24px}.logo span{color:#ffa726}
    h1{font-family:Georgia,serif;font-size:clamp(22px,4vw,36px);font-weight:700;margin-bottom:12px}
    p{opacity:.85;font-size:15px;line-height:1.8;margin-bottom:20px}
    .gear{font-size:80px;animation:spin 4s linear infinite;display:block;margin-bottom:20px}
    @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
    .timer{display:flex;gap:12px;justify-content:center;margin:24px 0}
    .t-unit{background:rgba(0,0,0,.2);border-radius:10px;padding:14px 18px;min-width:64px}
    .t-num{font-size:28px;font-weight:900;line-height:1}
    .t-label{font-size:10px;opacity:.7;text-transform:uppercase;letter-spacing:1px;margin-top:3px}
    .notify-form{display:flex;gap:0;border:1px solid rgba(255,255,255,.3);border-radius:10px;overflow:hidden;max-width:360px;margin:0 auto}
    .notify-form input{flex:1;padding:12px 16px;background:rgba(255,255,255,.1);border:none;color:#fff;font-size:13px}
    .notify-form input::placeholder{color:rgba(255,255,255,.5)}
    .notify-form button{padding:0 20px;background:#ff6f00;border:none;color:#fff;font-size:18px;cursor:pointer}
    .social{display:flex;gap:10px;justify-content:center;margin-top:20px}
    .social a{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:18px;transition:background .15s}
    .social a:hover{background:rgba(255,255,255,.25)}
  </style>
</head>
<body>
<div class="card">
  <div class="logo">Jloodna <span>|</span> Global Trading</div>
  <span class="gear">⚙️</span>
  <h1>Maintenance en cours</h1>
  <p>Nous améliorons notre boutique pour vous offrir une meilleure expérience. Nous serons de retour très bientôt!</p>

  <div class="timer">
    <div class="t-unit"><div class="t-num" id="mHours">00</div><div class="t-label">Heures</div></div>
    <div class="t-unit"><div class="t-num" id="mMins">00</div><div class="t-label">Minutes</div></div>
    <div class="t-unit"><div class="t-num" id="mSecs">00</div><div class="t-label">Secondes</div></div>
  </div>

  <p style="font-size:13px">Notifiez-moi dès le retour:</p>
  <div class="notify-form">
    <input type="email" id="notifyEmail" placeholder="votre@email.com">
    <button onclick="notifyMe()">🔔</button>
  </div>

  <div style="margin-top:24px;font-size:13px;opacity:.7">
    <p>Besoin d'aide urgente?</p>
    <a href="https://wa.me/50940894038" style="color:#ffa726;font-weight:600">WhatsApp: +509 00 00 40 38</a>
  </div>

  <div class="social">
    <a href="#" title="Facebook">📘</a>
    <a href="#" title="Instagram">📸</a>
    <a href="https://wa.me/50940894038" title="WhatsApp">💬</a>
  </div>

  <!-- Admin bypass (hidden) -->
  <div style="margin-top:32px;padding-top:20px;border-top:1px solid rgba(255,255,255,.1)">
    <a href="auth/login.html" style="font-size:11px;color:rgba(255,255,255,.3)">Administration</a>
  </div>
</div>

<script>
  // Countdown to end of maintenance (set 2 hours from now as demo)
  const endTime = new Date(Date.now() + 2 * 3600000);
  setInterval(() => {
    const diff = endTime - Date.now();
    if (diff <= 0) { document.querySelectorAll('.t-num').forEach(el => el.textContent = '00'); return; }
    document.getElementById('mHours').textContent = String(Math.floor(diff / 3600000)).padStart(2,'0');
    document.getElementById('mMins').textContent  = String(Math.floor((diff % 3600000) / 60000)).padStart(2,'0');
    document.getElementById('mSecs').textContent  = String(Math.floor((diff % 60000) / 1000)).padStart(2,'0');
  }, 1000);

  function notifyMe() {
    const email = document.getElementById('notifyEmail').value;
    if (!email || !email.includes('@')) { alert('Email invalide.'); return; }
    alert('Merci! Vous serez notifié dès le retour du site.');
    document.getElementById('notifyEmail').value = '';
  }
</script>
</body>
</html>
